<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ニュートピア サウンドテストROM 生成ツール v2.6</title>
<style>
  body { font-family: sans-serif; background: #1a1a2e; color: #eee; max-width: 640px; margin: 30px auto; padding: 0 16px; }
  h1 { font-size: 1.35rem; border-bottom: 2px solid #4ecca3; padding-bottom: 6px; }
  .card { background: #16213e; border-radius: 8px; padding: 18px; margin-bottom: 16px; }
  input[type="file"] { display: block; margin: 12px 0; color: #eee; }
  button { background: #4ecca3; color: #1a1a2e; border: none; border-radius: 4px; padding: 10px 20px; font-weight: bold; cursor: pointer; font-size: 1rem; }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  .log { font-family: monospace; font-size: 0.85rem; background: #0f3460; padding: 12px; border-radius: 6px; margin-top: 12px; white-space: pre-wrap; color: #ffd369; }
  ul { line-height: 1.7; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>ニュートピア サウンドテストROM 生成ツール v2.6</h1>

<div class="card">
  <p>手元の『ニュートピア』の <code>.pce</code> ファイルを選択してください。</p>
  <input type="file" id="romFile" accept=".pce,.bin">
  <button id="buildBtn" disabled onclick="buildRom()">サウンドテストROMを生成してダウンロード</button>
  <div id="log" class="log">ROMファイルを選択してください。</div>
</div>

<div class="card">
  <strong>エミュレータ（jspce）での操作方法</strong>
  <ul>
    <li><b>← / →</b>：曲番号 -1 / +1</li>
    <li><b>↑ / ↓</b>：曲番号 +$10 / -$10</li>
    <li><b>I ボタン（Xキー）</b>：再生</li>
    <li><b>II ボタン（Zキー）</b>：停止（$7C）</li>
  </ul>
</div>

<script>
let origRom = null;

document.getElementById('romFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  const log = document.getElementById('log');
  const btn = document.getElementById('buildBtn');
  if (!file) return;

  origRom = new Uint8Array(await file.arrayBuffer());
  const hasHeader = (origRom.length % 8192) === 512;
  const base = hasHeader ? 512 : 0;

  if (origRom.length < base + 0x10000 ||
      origRom[base + 0x0152] !== 0x4C ||
      origRom[base + 0x0153] !== 0xD2 ||
      origRom[base + 0x0154] !== 0xE3) {
    log.textContent = `警告: 想定したニュートピアROMと先頭コードが一致しません。\nサイズ: ${origRom.length} bytes (ヘッダ: ${hasHeader ? 'あり' : 'なし'})`;
  } else {
    log.textContent = `ニュートピアROMを検出しました！\nサイズ: ${origRom.length} bytes (512Bヘッダ: ${hasHeader ? 'あり' : 'なし'})\nビルド準備完了です。`;
  }
  btn.disabled = false;
});

const FONT_HEX = [
  0x3C,0x66,0x6E,0x76,0x66,0x66,0x3C,0x00, // 0
  0x18,0x38,0x18,0x18,0x18,0x18,0x7E,0x00, // 1
  0x3C,0x66,0x06,0x1C,0x30,0x60,0x7E,0x00, // 2
  0x3C,0x66,0x06,0x1C,0x06,0x66,0x3C,0x00, // 3
  0x0C,0x1C,0x3C,0x6C,0x7E,0x0C,0x0C,0x00, // 4
  0x7E,0x60,0x7C,0x06,0x06,0x66,0x3C,0x00, // 5
  0x3C,0x60,0x7C,0x66,0x66,0x66,0x3C,0x00, // 6
  0x7E,0x66,0x0C,0x18,0x18,0x18,0x18,0x00, // 7
  0x3C,0x66,0x66,0x3C,0x66,0x66,0x3C,0x00, // 8
  0x3C,0x66,0x66,0x3E,0x06,0x0C,0x38,0x00, // 9
  0x18,0x3C,0x66,0x7E,0x66,0x66,0x66,0x00, // A
  0x7C,0x66,0x66,0x7C,0x66,0x66,0x7C,0x00, // B
  0x3C,0x66,0x60,0x60,0x60,0x66,0x3C,0x00, // C
  0x78,0x6C,0x66,0x66,0x66,0x6C,0x78,0x00, // D
  0x7E,0x60,0x60,0x7C,0x60,0x60,0x7E,0x00, // E
  0x7E,0x60,0x60,0x7C,0x60,0x60,0x60,0x00  // F
];

function assemble(org) {
  const bytes = [];
  const labels = {};
  const fixups = [];
  const pc = () => org + bytes.length;
  const emit = (...arr) => arr.forEach(b => bytes.push(b & 0xFF));
  const label = (name) => { labels[name] = pc(); };
  const branch = (op, target) => {
    emit(op, 0);
    fixups.push({ type: 'rel', pos: bytes.length - 1, pc: pc(), target });
  };
  const jump = (op, target) => {
    emit(op, 0, 0);
    fixups.push({ type: 'abs', pos: bytes.length - 2, target });
  };
  const ldaAbs = (op, target) => {
    emit(op, 0, 0);
    fixups.push({ type: 'abs', pos: bytes.length - 2, target });
  };

  // --- メイン処理 ($3600) ---
  emit(0x78); // SEI (割り込み禁止のまま動作)

  // 1. VCE パレット設定 (色0=濃紫 $0012, 色1=白 $01FF)
  emit(0x9C, 0x02, 0x04);
  emit(0x9C, 0x03, 0x04);
  emit(0xA9, 0x12, 0x8D, 0x04, 0x04);
  emit(0x9C, 0x05, 0x04);
  emit(0xA9, 0xFF, 0x8D, 0x04, 0x04);
  emit(0xA9, 0x01, 0x8D, 0x05, 0x04);

  // 2. VDC 基本設定
  emit(0x03, 0x07, 0x13, 0x00, 0x23, 0x00); // BXR = 0
  emit(0x03, 0x08, 0x13, 0x00, 0x23, 0x00); // BYR = 0
  emit(0x03, 0x09, 0x13, 0x00, 0x23, 0x00); // MWR = 32x32

  // 3. フォント転送 (VRAM $1000)
  emit(0x03, 0x00, 0x13, 0x00, 0x23, 0x10);
  emit(0x03, 0x02);
  emit(0xA2, 0x00);

  label('font_tile_loop');
  emit(0xA0, 0x08);
  label('font_row_loop');
  ldaAbs(0xBD, 'font_data');
  emit(0x8D, 0x02, 0x00);
  emit(0x9C, 0x03, 0x00);
  emit(0xE8, 0x88);
  branch(0xD0, 'font_row_loop');
  emit(0xA0, 0x08);
  label('font_zero_loop');
  emit(0x13, 0x00, 0x23, 0x00, 0x88);
  branch(0xD0, 'font_zero_loop');
  emit(0xE0, 0x80);
  branch(0xD0, 'font_tile_loop');

  // 空白タイル ($110)
  emit(0xA0, 0x10);
  label('blank_tile_loop');
  emit(0x13, 0x00, 0x23, 0x00, 0x88);
  branch(0xD0, 'blank_tile_loop');

  // 4. BAT クリア
  emit(0x03, 0x00, 0x13, 0x00, 0x23, 0x00);
  emit(0x03, 0x02);
  emit(0xA2, 0x08, 0xA0, 0x00);
  label('bat_clear_loop');
  emit(0x13, 0x10, 0x23, 0x01, 0x88);
  branch(0xD0, 'bat_clear_loop');
  emit(0xCA);
  branch(0xD0, 'bat_clear_loop');

  // 5. 変数初期化 & BG ON + VBlankフラグ有効化
  emit(0xA9, 0x34, 0x8D, 0xF0, 0x37);       // 曲番号 = $34
  emit(0x9C, 0xF2, 0x37);                   // 前フレーム入力 = 0
  emit(0x03, 0x05, 0x13, 0x88, 0x23, 0x00); // VDC CR($05) = $0088

  // --- メインループ ---
  label('main_loop');

  // 自前 VBlank 待ち (VDCステータス $0000 の Bit5 を監視)
  label('wait_vblank');
  emit(0xAD, 0x00, 0x00);
  emit(0x29, 0x20);
  branch(0xF0, 'wait_vblank');

  // サウンドドライバ更新 (本来のタイマー約122.6Hzに合わせ、60Hzにつき2回呼ぶ)
  emit(0x20, 0x13, 0xE4);
  emit(0x20, 0x13, 0xE4);

  // 曲番号を画面中央 ($01CF, $01D0) に描画
  emit(0x03, 0x00, 0x13, 0xCF, 0x23, 0x01);
  emit(0x03, 0x02);
  emit(0xAD, 0xF0, 0x37);
  emit(0x4A, 0x4A, 0x4A, 0x4A);
  emit(0x8D, 0x02, 0x00, 0x23, 0x01);
  emit(0xAD, 0xF0, 0x37, 0x29, 0x0F);
  emit(0x8D, 0x02, 0x00, 0x23, 0x01);

  // 自前 パッド直接読み取り ($1000)
  emit(0xA9, 0x01, 0x8D, 0x00, 0x10);
  emit(0xEA, 0xEA, 0xEA);
  emit(0xAD, 0x00, 0x10);
  emit(0x49, 0xFF, 0x29, 0x0F);
  emit(0x0A, 0x0A, 0x0A, 0x0A);
  emit(0x8D, 0xF3, 0x37);

  emit(0x9C, 0x00, 0x10);
  emit(0xEA, 0xEA, 0xEA);
  emit(0xAD, 0x00, 0x10);
  emit(0x49, 0xFF, 0x29, 0x0F);
  emit(0x0D, 0xF3, 0x37);

  // トリガー計算: trig = curr & ~prev
  emit(0xAA);
  emit(0xAD, 0xF2, 0x37);
  emit(0x49, 0xFF);
  emit(0x8D, 0xF3, 0x37);
  emit(0x8A);
  emit(0x8D, 0xF2, 0x37);
  emit(0x2D, 0xF3, 0x37);
  emit(0x8D, 0xF1, 0x37);

  // RIGHT ($20): +1
  emit(0x29, 0x20);
  branch(0xF0, 'chk_left');
  emit(0xEE, 0xF0, 0x37);

  label('chk_left');
  emit(0xAD, 0xF1, 0x37, 0x29, 0x80);
  branch(0xF0, 'chk_up');
  emit(0xCE, 0xF0, 0x37);

  label('chk_up');
  emit(0xAD, 0xF1, 0x37, 0x29, 0x10);
  branch(0xF0, 'chk_down');
  emit(0xAD, 0xF0, 0x37, 0x18, 0x69, 0x10, 0x8D, 0xF0, 0x37);

  label('chk_down');
  emit(0xAD, 0xF1, 0x37, 0x29, 0x40);
  branch(0xF0, 'chk_btn1');
  emit(0xAD, 0xF0, 0x37, 0x38, 0xE9, 0x10, 0x8D, 0xF0, 0x37);

  label('chk_btn1');
  emit(0xAD, 0xF1, 0x37, 0x29, 0x01); // I ボタン
  branch(0xF0, 'chk_btn2');
  emit(0xAD, 0xF0, 0x37);
  emit(0x8D, 0x57, 0x2A);             // STA $2A57
  emit(0x20, 0x2D, 0xE4);             // JSR $E42D (再生)

  label('chk_btn2');
  emit(0xAD, 0xF1, 0x37, 0x29, 0x02); // II ボタン
  branch(0xF0, 'next_frame');
  emit(0xA9, 0x7C);
  emit(0x8D, 0x57, 0x2A);             // STA $2A57
  emit(0x20, 0x2D, 0xE4);             // JSR $E42D (停止)

  label('next_frame');
  jump(0x4C, 'main_loop');

  label('font_data');
  emit(...FONT_HEX);

  for (const f of fixups) {
    const addr = labels[f.target];
    if (f.type === 'rel') {
      bytes[f.pos] = (addr - f.pc) & 0xFF;
    } else {
      bytes[f.pos] = addr & 0xFF;
      bytes[f.pos + 1] = (addr >> 8) & 0xFF;
    }
  }
  return new Uint8Array(bytes);
}

function buildRom() {
  if (!origRom) return;
  const rom = origRom.slice();
  const base = (rom.length % 8192 === 512) ? 512 : 0;

  rom[base + 0x0152] = 0x4C;
  rom[base + 0x0153] = 0xB8;
  rom[base + 0x0154] = 0xFF;

  const loader = [
    0x78,
    0xA9, 0x05, 0x53, 0x20,
    0x73, 0x10, 0xAE, 0x00, 0x36, 0xF0, 0x01,
    0x4C, 0x00, 0x36
  ];
  rom.set(loader, base + 0x1FB8);

  const code = assemble(0x3600);
  rom.set(code, base + 0xAE10);

  const blob = new Blob([rom], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'neutopia_soundtest_v26.pce';
  a.click();

  document.getElementById('log').textContent =
    `v2.6 生成完了！ (本体サイズ: ${code.length} bytes)\nneutopia_soundtest_v26.pce を jspce に読み込んでください。`;
}
</script>
</body>
</html>
